<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEBORY Chemistry Lab Pro</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cy:#06b6d4;--em:#10b981;--am:#f59e0b;--pu:#a855f7;--rd:#ef4444;--mu:#94a3b8}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 15% 0,#14265a,transparent 50%),radial-gradient(circle at 90% 100%,#2b1253,transparent 45%),#0a0f1d;color:#e2e8f0;font:15px/1.55 system-ui,Segoe UI,sans-serif;min-height:100vh}
nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;padding:10px 14px;background:rgba(10,15,29,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(6,182,212,.35);overflow-x:auto;white-space:nowrap}
.brand{font-weight:800;color:var(--cy);margin-right:auto;text-shadow:0 0 12px var(--cy)}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;border:1px solid var(--pu);color:#d8b4fe;font-size:12px;box-shadow:0 0 14px #a855f755}
main{max-width:1000px;margin:0 auto;padding:16px}
.glass{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px;margin-bottom:16px}
h1{font-size:clamp(26px,5vw,42px);margin:10px 0;background:linear-gradient(90deg,var(--cy),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin-bottom:8px}.mu{color:var(--mu);font-size:13px}.g{color:var(--em)}.r{color:var(--rd)}.am{color:var(--am)}
.btn{font:inherit;color:#e2e8f0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 14px;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px #06b6d440;border-color:var(--cy)}.btn:active{transform:scale(.95)}
.btn.on{background:var(--cy);color:#04121a;font-weight:700}.pri{background:linear-gradient(135deg,var(--cy),var(--pu));border:0;font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0}.spread{justify-content:space-between}
.inp{width:100%;padding:10px 12px;margin:8px 0;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font:inherit}
select.inp{width:auto;min-width:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.el{border:1px solid;border-radius:12px;padding:6px;text-align:center;background:rgba(255,255,255,.04);cursor:pointer;color:#fff;font:inherit;transition:all .25s cubic-bezier(.34,1.56,.64,1);animation:in .4s both}
.el:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 0 18px currentColor}.el b{display:block;font-size:22px}.el small{font-size:10px;color:var(--mu)}
@keyframes in{from{opacity:0;transform:scale(.85)}}
.mm{display:inline-block;width:14px;height:14px;margin:1px;border-radius:3px;cursor:pointer}
.chip{font-size:12px;padding:2px 10px;border:1px solid;border-radius:99px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:12px;overflow:auto}
.md{max-width:640px;width:100%;position:relative;animation:in .3s both}.x{position:absolute;right:12px;top:12px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}dt{color:var(--mu)}dd{font-weight:600}
.note{padding:10px 12px;border-left:3px solid var(--cy);background:rgba(6,182,212,.08);border-radius:8px;margin-top:8px}.exc{border-color:var(--rd);background:rgba(239,68,68,.1)}
.dot{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}.dot.full{filter:drop-shadow(0 0 5px #10b981)}
@keyframes pop{from{transform:scale(0);opacity:0}}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--em));transition:width .5s}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:6px 0;padding:12px}.opt:disabled{cursor:default;transform:none}
.opt.right{border-color:var(--em);background:rgba(16,185,129,.2);box-shadow:0 0 18px #10b98166}.opt.wrong{border-color:var(--rd);background:rgba(239,68,68,.2)}
.fb{padding:12px;border-radius:12px;margin:8px 0}.fb.good{background:rgba(16,185,129,.15);border:1px solid var(--em)}.fb.bad{background:rgba(239,68,68,.12);border:1px solid var(--rd)}
.shake{animation:sh .4s}.okglow{box-shadow:0 0 30px #10b98166;border-color:var(--em)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cf{position:fixed;top:60%;width:8px;height:12px;z-index:99;pointer-events:none;animation:cf 1.3s ease-out forwards}
@keyframes cf{40%{transform:translate(calc(var(--x)*.6),var(--y))}to{transform:translate(var(--x),400px) rotate(var(--r));opacity:0}}
.big{font-size:42px;font-weight:800;color:var(--cy)}.center{text-align:center}
#cert .ci{border:3px double var(--am);border-radius:14px;padding:22px;text-align:center;background:linear-gradient(135deg,#1b1530,#0f1d33);margin:12px 0}
.cn{font-size:28px;font-weight:700;color:var(--am);margin:6px 0}.seal{font-size:40px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--cy),var(--pu));font-weight:800;color:#04121a;flex:none}#auth{z-index:60}
footer{text-align:center;padding:24px;color:var(--mu);font-size:13px}
@media(max-width:700px){.badge.hide{display:none}}
@media print{body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<nav><span class="brand">⚛ DEBORY Chemistry Lab Pro</span><span class="badge hide">Created &amp; Developed by DEBORY</span>
<button class="btn" data-v="explore" onclick="go('explore')">Explore</button><button class="btn" data-v="lab" onclick="go('lab')">Lewis Lab</button><button class="btn" data-v="quiz" onclick="go('quiz')">Quiz Arena</button><button class="btn" data-v="practice" onclick="go('practice')">Practice</button><button class="btn" data-v="stats" onclick="go('stats')">Stats</button><span id="usr" class="row" style="margin:0;flex-wrap:nowrap"></span><button class="btn" id="mt" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">🔊</button></nav>
<main id="app"></main>
<footer>© DEBORY — Created &amp; Developed by DEBORY · DEBORY Chemistry Lab Pro · Grade 11 Chemistry</footer>
<script>
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:8px 12px;z-index:99;font:13px monospace';d.textContent='Script error: '+e.message;document.body.appendChild(d)});
/* ===== PASTE YOUR SUPABASE KEYS HERE (Project Settings > API) ===== */
const SUPABASE_URL='',SUPABASE_ANON_KEY='';
const SH=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6]];
const NAMES="Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon Sodium Magnesium Aluminum Silicon Phosphorus Sulfur Chlorine Argon Potassium Calcium Scandium Titanium Vanadium Chromium Manganese Iron Cobalt Nickel Copper Zinc Gallium Germanium Arsenic Selenium Bromine Krypton".split(' ');
const SYMS="H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr".split(' ');
function cfg(z,x=true){let r=z,o=SH.map(([l,c])=>{const n=Math.min(c,r);r-=n;return[l,n]});
 if(x&&(z==24||z==29)){o[5][1]=1;o[6][1]=z==24?5:10}
 o=o.filter(a=>a[1]);const k=z>18?5:z>10?3:z>2?1:0,j=a=>a.map(q=>q.join('')).join(' ');
 return{o,full:j(o),cond:(k?['[He]','[Ne]','[Ar]'][k>>1]+' ':'')+j(o.slice(k))}}
const E=SYMS.map((s,i)=>{const z=i+1,c=cfg(z),g=z<3?[1,18][i]:z<5?z-2:z<11?z+8:z<13?z-10:z<19?z:z-18,nx=Math.max(...c.o.map(x=>+x[0][0]));
 return{z,s,nm:NAMES[i],...c,g,nx,p:z<3?1:z<11?2:z<19?3:4,b:z<3||g<3?'s':g>12?'p':'d',v:c.o.filter(x=>+x[0][0]==nx).reduce((a,x)=>a+x[1],0),exc:z==24||z==29}});
const col=e=>e.g==18?'#06b6d4':e.b=='s'?'#f59e0b':e.b=='p'?'#10b981':'#a855f7';
const $=s=>document.querySelector(s),A=$('#app'),G={t:0,c:0,best:0,name:'',hist:[]};
const sup=s=>s.replace(/([spd])(\d+)/g,'$1<sup>$2</sup>'),shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const gr=p=>p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':'F';
const note=e=>e.z==24?'EXCEPTION: Cr is 4s¹ 3d⁵ (not 4s² 3d⁴). One 4s electron moves into 3d, giving a half-filled d-subshell (d⁵) with extra stability.':e.z==29?'EXCEPTION: Cu is 4s¹ 3d¹⁰ (not 4s² 3d⁹). One 4s electron moves into 3d, giving a completely filled d-subshell (d¹⁰) with extra stability.':e.g==18?'Noble gas: '+(e.z==2?'complete duet (1s²)':'complete octet')+', chemically inert.':e.b=='d'?'Transition metal: the 3d electrons are in an inner shell (n=3), so only the 4s electrons are valence electrons.':`${e.b}-block: valence electrons are all electrons in the highest energy level, n = ${e.nx}.`;
const info=e=>`<dl><dt>Full config</dt><dd>${sup(e.full)}</dd><dt>Noble-gas code</dt><dd>${sup(e.cond)}</dd><dt>Valence e⁻</dt><dd>${e.v} (n = ${e.nx})</dd><dt>Location</dt><dd>Period ${e.p} · Group ${e.g} · ${e.b}-block</dd></dl>`;
const explain=e=>`${e.nm} (Z = ${e.z}) is in Period ${e.p}, Group ${e.g}, ${e.b}-block. Full: ${sup(e.full)}. Condensed: ${sup(e.cond)}. Highest energy level n = ${e.nx} holds ${e.v} valence electron(s). ${note(e)}`;
/* Audio */
let AC,mute=false;
function tn(f,d=.12,t='sine',at=0,g=.15){if(mute)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime+at;o.type=t;o.frequency.value=f;v.gain.setValueAtTime(g,t0);v.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(v).connect(AC.destination);o.start(t0);o.stop(t0+d)}
const snd={click:()=>tn(600,.06),ok:()=>[523,659,784].forEach((f,i)=>tn(f,.28,'triangle',i*.09)),bad:()=>{tn(160,.3,'sawtooth');tn(120,.35,'sawtooth',.12)}};
document.addEventListener('click',e=>{if(e.target.closest('button'))snd.click()});
function confetti(){for(let i=0;i<36;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${45+Math.random()*10}%;background:${['#06b6d4','#10b981','#f59e0b','#a855f7'][i%4]};--x:${Math.random()*600-300}px;--y:${-150-Math.random()*250}px;--r:${Math.random()*720}deg`;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}}
/* Lewis SVG */
const dots=(z,v)=>z==2&&v==2?[0,2,0,0]:[0,1,2,3].map(i=>(v>i?1:0)+(v>i+4?1:0));
function lewis(e,v=e.v,sz=200){const d=dots(e.z,v),f=v==8||(e.z==2&&v==2),c=col(e);let k=0,s=`<svg viewBox="0 0 200 200" width="${sz}" height="${sz}"><rect x="60" y="60" width="80" height="80" rx="14" fill="${c}22" stroke="${c}" stroke-width="2"/><text x="100" y="110" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">${e.s}</text><text x="68" y="76" font-size="10" fill="${c}">${e.z}</text>`;
 d.forEach((n,side)=>{for(let j=0;j<n;j++){const a=n==1?100:[88,112][j],[x,y]=[[152,a],[a,48],[48,a],[a,152]][side];s+=`<circle class="dot${f?' full':''}" cx="${x}" cy="${y}" r="6" fill="${f?'#10b981':'#fbbf24'}" style="animation-delay:${k++*90}ms"/>`}});return s+'</svg>'}
/* Router */
const V={explore,lab,quiz,practice,stats};
function go(v){document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v));V[v]();scrollTo({top:0,behavior:'smooth'})}
/* Explore */
let F={p:'',g:'',b:''};
const sel=(k,l,o)=>`<select class="inp" onchange="F.${k}=this.value;grid()"><option value="">${l}: All</option>${o.map(x=>`<option ${F[k]==x?'selected':''}>${x}</option>`).join('')}</select>`;
function explore(){A.innerHTML=`<section class="glass center"><span class="badge">⚛ Created &amp; Developed by DEBORY</span><h1>DEBORY Chemistry Lab Pro</h1><p class="mu">Electron configurations · noble-gas notation · valence electrons · Lewis dots for Z = 1–36</p><div class="row" style="justify-content:center"><button class="btn pri" onclick="go('quiz')">Start Quiz Arena</button><button class="btn" onclick="go('lab')">Open Lewis Lab</button></div></section>
<div class="glass"><div class="row">${sel('p','Period',[1,2,3,4])}${sel('g','Group',[...Array(18).keys()].map(i=>i+1))}${sel('b','Block',['s','p','d'])}<span class="chip" style="color:#f59e0b">s-block</span><span class="chip" style="color:#10b981">p-block</span><span class="chip" style="color:#06b6d4">noble gas</span><span class="chip" style="color:#a855f7">d-block</span></div><div>${E.map(e=>`<i class="mm" title="${e.nm}" style="background:${col(e)}" onclick="modal(${e.z})"></i>`).join('')}</div></div><div id="grid" class="grid"></div>`;grid()}
function grid(){const l=E.filter(e=>(!F.p||e.p==F.p)&&(!F.g||e.g==F.g)&&(!F.b||e.b==F.b));$('#grid').innerHTML=l.map((e,i)=>`<button class="el" style="color:${col(e)};border-color:${col(e)};animation-delay:${i*15}ms" onclick="modal(${e.z})"><small>${e.z}</small><b>${e.s}</b><small>${e.nm}</small></button>`).join('')||'<p class="mu">No elements match these filters.</p>'}
function modal(z){const e=E[z-1],m=document.createElement('div');m.className='ov';m.onclick=ev=>{if(ev.target==m)m.remove()};m.innerHTML=`<div class="glass md"><button class="x" onclick="this.closest('.ov').remove()">✕</button><div class="row"><div>${lewis(e)}</div><div style="flex:1;min-width:220px"><h2 style="color:${col(e)}">${e.nm} (${e.s})</h2>${info(e)}</div></div><p class="note ${e.exc?'exc':''}">${note(e)}</p><p class="mu" style="margin-top:8px">Created &amp; Developed by DEBORY</p></div>`;document.body.appendChild(m)}
/* Lab */
let L=E[7];
function lab(){A.innerHTML=`<div class="glass"><h2>Interactive Lewis &amp; Quantum Laboratory</h2><input class="inp" placeholder="Search by symbol, name or Z (e.g. Fe, oxygen, 24)" oninput="srch(this.value)"><div id="lo"></div></div>`;lo()}
function srch(q){q=q.trim().toLowerCase();if(!q)return;const e=+q?E[q-1]:E.find(x=>x.s.toLowerCase()==q||x.nm.toLowerCase().startsWith(q));if(e){L=e;lo()}}
function lo(){const e=L;$('#lo').innerHTML=`<div class="row"><div id="lsv"></div><div style="flex:1;min-width:230px"><h3 style="color:${col(e)}">${e.nm} (${e.s})</h3>${info(e)}<label>Valence electrons shown: <b id="lv"></b></label><input type="range" min="1" max="8" value="${e.v}" oninput="lw(this.value)" style="width:100%"><p id="lt"></p></div></div><p class="note ${e.exc?'exc':''}">${note(e)}</p>`;lw(e.v)}
function lw(v){v=+v;const e=L,f=v==8||(e.z==2&&v==2),u=v<5?v:8-v;$('#lsv').innerHTML=lewis(e,v);$('#lv').textContent=v;$('#lt').innerHTML=f?'<b class="g">Stable octet/duet</b>: noble-gas stability, no bonding needed.':`<b>${u}</b> unpaired dot(s) → can form <b>${u}</b> covalent bond(s); needs ${8-v} more electron(s) for an octet.`}
/* Quiz */
let Q;
function quiz(){A.innerHTML=`<div class="glass"><h2>Quiz Arena</h2><p class="mu">10 questions per round. Pick a difficulty, then a mode.</p><select id="dif" class="inp"><option value="10">Easy · H–Ne</option><option value="20">Medium · H–Ca</option><option value="36" selected>Hard · H–Kr</option></select><div class="g3">${[['A','Full Electron Configuration','#06b6d4'],['B','Condensed Noble-Gas Notation','#10b981'],['C','Valence Electrons &amp; Lewis Dots','#a855f7']].map(([k,t,c])=>`<button class="btn" style="border-color:${c};padding:16px" onclick="startQ('${k}')">Mode ${k}<br><b>${t}</b></button>`).join('')}</div></div>`}
function startQ(m){Q={m,i:0,s:0,st:0,best:0,pool:shuf([...Array(+$('#dif').value).keys()]).slice(0,10)};nq()}
function nq(){if(Q.i>=Q.pool.length)return done();const e=E[Q.pool[Q.i]],m=Q.m;Q.e=e;Q.done=0;let q,o;
 if(m=='C'){q=`Which Lewis dot structure matches <b>${e.nm} (${e.s})</b>, Z = ${e.z}?`;o=shuf([e.v,...shuf([1,2,3,4,5,6,7,8].filter(x=>x!=e.v)).slice(0,3)]).map(v=>({h:lewis(e,v,110),c:v==e.v,t:`${v} valence electron(s)`}))}
 else{const k=m=='A'?'full':'cond',ok=e[k];q=`What is the ${m=='A'?'FULL electron configuration':'CONDENSED (noble-gas) notation'} of <b>${e.nm} (${e.s})</b>, Z = ${e.z}?`;
  const w=[...new Set([...(e.exc?[cfg(e.z,false)[k]]:[]),...[-1,1,-2,2,3,-3].map(d=>E[e.z-1+d]).filter(Boolean).map(x=>x[k])])].filter(x=>x!=ok).slice(0,3);
  o=shuf([ok,...w]).map(t=>({h:sup(t),c:t==ok,t}))}
 Q.o=o;A.innerHTML=`<div class="glass" id="qc"><div class="row spread"><b>Question ${Q.i+1}/${Q.pool.length}</b><span>Score ${Q.s}</span><span>🔥 Streak <b id="stk">${Q.st}</b></span></div><div class="bar"><i style="width:${Q.i/Q.pool.length*100}%"></i></div><h3 style="margin:10px 0">${q}</h3>${o.map((x,i)=>`<button class="btn opt" onclick="pick(${i})"><b>${'ABCD'[i]}</b>${x.h}</button>`).join('')}<div id="fb"></div></div>`}
function pick(i){if(Q.done)return;Q.done=1;const c=Q.o.findIndex(x=>x.c),ok=i==c,lb=o=>Q.m=='C'?o.t:o.h;G.t++;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=1;if(j==c)b.classList.add('right');else if(j==i)b.classList.add('wrong')});
 if(ok){G.c++;Q.s++;Q.st++;Q.best=Math.max(Q.best,Q.st);G.best=Math.max(G.best,Q.st);snd.ok();confetti();$('#qc').classList.add('okglow')}else{Q.st=0;snd.bad();$('#qc').classList.add('shake')}
 $('#stk').textContent=Q.st;save();
 $('#fb').innerHTML=(ok?`<div class="fb good"><h3 class="g">✓ CORRECT! Streak +1${Q.st>1?' (×'+Q.st+')':''}</h3></div>`:`<div class="fb bad"><h3 class="r">✗ INCORRECT!</h3><p>Your answer: <b class="r">${lb(Q.o[i])}</b></p><p>Correct answer: <b class="g">${lb(Q.o[c])}</b></p><p style="margin-top:6px">${explain(Q.e)}</p></div>`)+`<button class="btn pri" onclick="Q.i++;nq()">${Q.i+1>=Q.pool.length?'See results':'Next →'}</button>`}
const cert=(p,d)=>`<input class="inp" placeholder="Enter student name for the certificate" value="${esc(G.name)}" oninput="G.name=this.value;$('#cn').textContent=this.value||'Student Name'"><div id="cert"><div class="ci"><div class="badge">DEBORY</div><h3>Official Chemistry Mastery Certificate</h3><p class="mu">This certifies that</p><div id="cn" class="cn">${esc(G.name)||'Student Name'}</div><p>${d}</p><p class="big">Grade ${gr(p)} · ${p}%</p><div class="seal">⚛</div><p class="mu">Created &amp; Developed by DEBORY · DEBORY Chemistry Lab Pro · ${new Date().toLocaleDateString()}</p></div></div><button class="btn" onclick="print()">🖨 Print / Save Certificate</button>`;
function done(){const n=Q.pool.length,p=Math.round(Q.s/n*100);G.hist.push({d:new Date().toISOString().slice(0,10),m:Q.m,s:Q.s,n});save();A.innerHTML=`<div class="glass center"><h2>Quiz Complete</h2><div class="big">${Q.s}/${n} · ${p}%</div><p>Grade <b>${gr(p)}</b> · Best streak ${Q.best}</p>${cert(p,`completed Quiz Mode ${Q.m} with a score of ${Q.s}/${n}`)}<div class="row" style="justify-content:center"><button class="btn pri" onclick="quiz()">Play again</button></div></div>`;if(p>=70){snd.ok();confetti()}}
/* Practice */
let PR;
function practice(){PR=E[Math.random()*36|0];PR.done=0;A.innerHTML=`<div class="glass"><h2>Free Practice</h2><p>Write the full or condensed configuration of <b>${PR.nm} (${PR.s})</b>, Z = ${PR.z}. ${PR.exc?'<span class="am">Careful: this one is an exception!</span>':''}</p><input id="pa" class="inp" placeholder="1s2 2s2 2p6 …   or   [Ne] 3s2 3p4" onkeydown="if(event.key=='Enter')chk()"><div class="row"><button class="btn pri" onclick="chk()">Check</button><button class="btn" onclick="practice()">New element</button></div><div id="pf"></div></div>`}
const tk=s=>s.toLowerCase().replace(/[\^{}]/g,'').replace(/\]/g,'] ').trim().split(/\s+/).filter(Boolean).sort();
function chk(){const raw=$('#pa').value,u=tk(raw).join(' '),ok=u==tk(PR.full).join(' ')||u==tk(PR.cond).join(' ');if(!PR.done){PR.done=1;G.t++;if(ok)G.c++;save()}
 if(ok){snd.ok();confetti();$('#pf').innerHTML=`<div class="fb good"><h3 class="g">✓ CORRECT!</h3><p>${sup(PR.full)} = ${sup(PR.cond)}</p></div>`;return}
 snd.bad();let run=0;const ok2=new Set([...tk(PR.full),...tk(PR.cond)]),bad=tk(raw).filter(t=>!ok2.has(t));
 $('#pf').innerHTML=`<div class="fb bad shake"><h3 class="r">✗ INCORRECT!</h3><p>Your answer: <b class="r">${raw||'(empty)'}</b></p><p>Correct full: <b class="g">${sup(PR.full)}</b></p><p>Correct condensed: <b class="g">${sup(PR.cond)}</b></p>${bad.length?`<p>Check these parts: <b class="r">${bad.join(', ')}</b></p>`:''}<p class="mu" style="margin-top:6px">Step by step (Aufbau): ${PR.o.map(([l,n])=>`${sup(l+n)} (${run+=n} e⁻)`).join(' → ')}</p><p style="margin-top:6px">${explain(PR)}</p></div>`}
/* Stats */
function stats(){const p=G.t?Math.round(G.c/G.t*100):0;A.innerHTML=`<div class="glass center"><h2>Performance &amp; Stats</h2><svg viewBox="0 0 140 140" width="160"><circle cx="70" cy="70" r="54" fill="none" stroke="#ffffff22" stroke-width="12"/><circle cx="70" cy="70" r="54" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="${339.3*(1-p/100)}" transform="rotate(-90 70 70)" style="transition:stroke-dashoffset .8s"/><text x="70" y="78" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">${p}%</text></svg><div class="row" style="justify-content:center"><span>Answered: <b>${G.t}</b></span><span class="g">Correct: <b>${G.c}</b></span><span>Best streak: <b>${G.best}</b></span><span>Grade: <b>${gr(p)}</b></span></div>${SB&&U?'<p class="mu">☁ Progress synced to your account</p>':''}${G.hist.length?'<h3>Recent quizzes</h3>'+G.hist.slice(-5).reverse().map(h=>`<div class="mu">${h.d} · Mode ${h.m} · ${h.s}/${h.n}</div>`).join(''):''}${G.t?cert(p,`overall accuracy across ${G.t} questions`):'<p class="mu">Answer some questions to see your certificate.</p>'}</div>`}
/* ===== Auth & cloud progress (Supabase) ===== */
let SB=null,SBERR='';
try{if(SUPABASE_URL&&SUPABASE_ANON_KEY){if(!window.supabase)SBERR='Supabase library failed to load (check internet / ad-blocker).';else SB=supabase.createClient(SUPABASE_URL.trim(),SUPABASE_ANON_KEY.trim())}}catch(e){SBERR='Invalid Supabase URL or key: '+e.message}
if(SBERR)console.error(SBERR);
let U=null,REC=0,svt;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
const nm=()=>U?.user_metadata?.full_name||U?.email?.split('@')[0]||'';
const pw=p=>p.length>=8&&/[a-z]/.test(p)&&/[A-Z]/.test(p)&&/\d/.test(p);
const lk=(m,t)=>`<a href="#" style="color:var(--cy)" onclick="authView('${m}');return false">${t}</a>`;
function renderNav(){$('#usr').innerHTML=U?`<span class="av">${esc(nm()[0]||'?').toUpperCase()}</span><span class="mu" style="line-height:1.2"><b style="color:#fff">${esc(nm())}</b><br>${esc(U.email)}</span><button class="btn" onclick="SB.auth.signOut()">Sign out</button>`:SB?'':`<span class="badge" title="${esc(SBERR)}">${SBERR?'Auth setup error (press F12)':'Guest mode · add Supabase keys'}</span>`}
function pwm(p){const r=[p.length>=8,/[a-z]/.test(p),/[A-Z]/.test(p),/\d/.test(p)].filter(Boolean).length;$('#ps').innerHTML=`Strength: <b class="${r==4?'g':r>2?'am':'r'}">${['Very weak','Weak','Fair','Good','Strong'][r]}</b> · needs 8+ chars, a–z, A–Z, 0–9`}
function authView(m){let a=$('#auth');if(!a){a=document.createElement('div');a.id='auth';a.className='ov';document.body.appendChild(a)}
 const f=(id,t,ph,x='')=>`<input id="${id}" type="${t}" class="inp" placeholder="${ph}" ${x}>`,tabs=m=='in'||m=='up';
 a.onkeydown=e=>{if(e.key=='Enter')authDo(m)};
 a.innerHTML=`<div class="glass md"><div class="center"><span class="badge">Created &amp; Developed by DEBORY</span><h2 style="margin-top:8px">⚛ DEBORY Chemistry Lab Pro</h2><p class="mu">${{in:'Sign in to continue',up:'Create your student account',forgot:'Reset your password',reset:'Choose a new password'}[m]}</p></div>
 ${tabs?`<div class="row" style="justify-content:center">${[['in','Sign In'],['up','Sign Up']].map(([k,t])=>`<button class="btn ${m==k?'on':''}" onclick="authView('${k}')">${t}</button>`).join('')}</div>`:''}
 ${m=='up'?f('an','text','Full name'):''}${m!='reset'?f('ae','email','Email address'):''}${m!='forgot'?f('ap','password',m=='in'?'Password':'Password (min 8 chars, Aa1)',m=='in'?'':'oninput="pwm(this.value)"'):''}
 ${m=='up'||m=='reset'?'<div id="ps" class="mu"></div>':''}
 <button class="btn pri" style="width:100%;margin-top:8px" onclick="authDo('${m}')">${{in:'Sign In',up:'Create Account',forgot:'Send Reset Link',reset:'Update Password'}[m]}</button>
 <div id="am" style="margin-top:8px"></div>${m=='in'?`<p class="mu" style="margin-top:8px">${lk('forgot','Forgot password?')}</p>`:''}${m=='forgot'?`<p class="mu" style="margin-top:8px">${lk('in','← Back to sign in')}</p>`:''}</div>`}
async function authDo(m){const v=id=>($('#'+id)?.value||'').trim(),msg=(t,ok)=>$('#am').innerHTML=`<span class="${ok?'g':'r'}">${t}</span>`,e=v('ae'),p=$('#ap')?.value||'',redir=location.href.split(/[?#]/)[0];
 if(m!='reset'&&!/^\S+@\S+\.\S+$/.test(e))return msg('Please enter a valid email address.');
 if((m=='up'||m=='reset')&&!pw(p))return msg('Password needs 8+ characters with upper-case, lower-case and a digit.');
 if(m=='up'&&v('an').length<2)return msg('Please enter your full name.');
 try{
  if(m=='up'){const{data,error}=await SB.auth.signUp({email:e,password:p,options:{data:{full_name:v('an')},emailRedirectTo:redir}});if(error)throw error;
   if(data.user?.identities?.length===0)return msg('This email is already registered. Please sign in.');
   if(!data.session)msg('✓ Account created! A verification link was sent to '+esc(e)+'. Open it to activate your account, then sign in.',1)}
  else if(m=='in'){const{error}=await SB.auth.signInWithPassword({email:e,password:p});
   if(error){if(/confirm/i.test(error.message)){$('#am').innerHTML='<span class="r">Email not verified yet.</span> <a href="#" style="color:var(--cy)" onclick="resend();return false">Resend verification email</a>';return}throw error}}
  else if(m=='forgot'){const{error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:redir});if(error)throw error;msg('✓ Reset link sent. Check your inbox.',1)}
  else{const{error}=await SB.auth.updateUser({password:p});if(error)throw error;msg('✓ Password updated!',1);REC=0;U=null;setTimeout(async()=>setUser((await SB.auth.getSession()).data.session?.user||null),700)}
 }catch(x){msg(esc(x.message))}}
async function resend(){const{error}=await SB.auth.resend({type:'signup',email:$('#ae').value.trim(),options:{emailRedirectTo:location.href.split(/[?#]/)[0]}});$('#am').innerHTML=error?`<span class="r">${esc(error.message)}</span>`:'<span class="g">✓ Verification email sent again.</span>'}
async function load(){const{data}=await SB.from('progress').select('*').eq('user_id',U.id).maybeSingle();Object.assign(G,data?{t:data.total,c:data.correct,best:data.best_streak,hist:data.history||[]}:{t:0,c:0,best:0,hist:[]});G.name=nm()}
function save(){if(!SB||!U)return;clearTimeout(svt);svt=setTimeout(()=>SB.from('progress').upsert({user_id:U.id,total:G.t,correct:G.c,best_streak:G.best,history:G.hist.slice(-20),updated_at:new Date().toISOString()}).then(r=>{if(r.error)console.warn('Save failed:',r.error.message)}),400)}
async function setUser(u){if(REC)return;if(u&&U&&u.id==U.id){U=u;return}U=u;renderNav();
 if(!u){Object.assign(G,{t:0,c:0,best:0,hist:[],name:''});authView('in');return}
 await load();$('#auth')?.remove();renderNav();go('explore')}
function boot(){renderNav();go('explore');if(!SB)return;
 SB.auth.onAuthStateChange((ev,s)=>{if(ev=='PASSWORD_RECOVERY'){REC=1;U=s?.user||null;setTimeout(()=>authView('reset'))}else setTimeout(()=>setUser(s?.user||null))})}
boot();
</script></body></html>
